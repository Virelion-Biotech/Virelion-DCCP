name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff==0.16.7

      - name: Compile
        run: python -m compileall -q src tests

      - name: Ruff
        run: ruff check src tests

      - name: Pytest + coverage
        run: pytest -q --cov=dccp --cov-branch --cov-report=term-missing

      - name: CLI smoke tests
        run: |
          python -c "from dccp.cli import main; raise SystemExit(main(['--version']))"
          python -c "from dccp.cli import main; raise SystemExit(main(['validate','scenarios/examples/SCENARIO-001.ordinary-mi.json']))"
          python -c "from dccp.cli import main; raise SystemExit(main(['audit-all','scenarios/examples']))"
          python -c "from dccp.cli import main; raise SystemExit(main(['registry','--root','scenarios/examples','--output','/tmp/dccp-registry.json']))"
          python -c "from dccp.cli import main; raise SystemExit(main(['release-gate','/tmp/dccp-registry.json','--base','.']))"
          python -c "from dccp.cli import main; raise SystemExit(main(['materialize','--root','scenarios/examples','--output','/tmp/dccp-challenge-set.json']))"
          python -c "from dccp.cli import main; raise SystemExit(main(['map-scores','--scores','inflammatory=0.8,contractile_functional=0.4','--draft-id','SCENARIO-902','-o','/tmp/draft.json']))"
          python -c "from dccp.cli import main; raise SystemExit(main(['validate','/tmp/draft.json']))"
          python -c "from dccp.cli import main; raise SystemExit(main(['bundle','--output-dir','/tmp/dccp-bundle','--run-id','ci','--input-files','scenarios/examples/SCENARIO-001.ordinary-mi.json']))"

      - name: Audit all repository scenarios
        run: python -c "from dccp.cli import main; raise SystemExit(main(['audit-all','scenarios']))"
