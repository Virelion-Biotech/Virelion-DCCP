name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff==0.16.7

      - name: Compile
        run: python -m compileall -q src tests

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: CLI smoke tests
        run: |
          dccp --version
          dccp validate scenarios/examples/SCENARIO-001.ordinary-mi.json
          dccp audit-all scenarios/examples
          dccp registry --root scenarios/examples --output /tmp/dccp-registry.json
          dccp release-gate /tmp/dccp-registry.json --base .
          dccp materialize --root scenarios/examples --output /tmp/dccp-challenge-set.json
          dccp map-scores --scores inflammatory=0.8,contractile_functional=0.4 --draft-id SCENARIO-902 >/tmp/draft.json
          dccp validate /tmp/draft.json

      - name: Audit all repository scenarios
        run: dccp audit-all scenarios
